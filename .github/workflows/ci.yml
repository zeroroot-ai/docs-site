name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ---- Node version guard (.github#23, epic #20) ----
      # One version file per repo; the Dockerfile FROM and every workflow
      # agree with it. The guard lives in the org repo, checked out at main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zeroroot-ai/.github
          ref: main
          path: .org-dot-github
      - name: Node version file, image and workflows agree
        run: bash .org-dot-github/scripts/check-node-version.sh --dir . --version-file .tool-versions


      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

  smoke:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    # Runs on pull requests too. A build-only, main-only job is how the #23
    # EACCES crashloop shipped: the artifact was never run before it hit the
    # cluster (same lesson as www's job). This job builds the image locally
    # and boots it. The publish is the `image` job below.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Boot the image exactly as the chart does (uid 101 by base USER) with
      # substitution env and assert a page whose functional links were
      # sentinelized: substituted origins in, sentinels gone. A container
      # that dies at start fails the curl loop.
      - name: Smoke-run the image with substituted origins
        run: |
          docker build -t docs-smoke .
          docker run -d --name docs-smoke -p 8080:8080 \
            -e APP_ORIGIN=https://app.staging.example \
            -e WWW_ORIGIN=https://www.staging.example \
            docs-smoke
          for _ in $(seq 1 30); do
            curl -fsm2 http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          docker logs docs-smoke
          H=$(curl -fsm5 http://localhost:8080/docs/install/)
          echo "$H" | grep -q 'https://www.staging.example' || { echo "FAIL: substituted www origin missing"; exit 1; }
          if echo "$H" | grep -q '__APP_ORIGIN__\|__WWW_ORIGIN__'; then echo "FAIL: sentinels leaked"; exit 1; fi
          docker exec docs-smoke sh -c 'test -s /licenses/LICENSE' \
            || { echo "FAIL: the image carries no license text"; exit 1; }
          echo "smoke OK: substituted origins served, license text present"


  image:
    needs: [build, smoke]
    # THE SHARED BUILD (.github#81). This job used to call
    # docker/build-push-action itself, with a hand-rolled licence label and
    # two hand-written tags, and produced no SBOM, no cosign attestation, no
    # SLSA provenance and no Trivy scan before the push. A fix in the shared
    # workflow reached every other repo and not this one.
    #
    # The shared workflow builds on every event and pushes on everything
    # except pull_request, so a PR still proves the Dockerfile builds and
    # passes Trivy, and a fork PR cannot publish.
    #
    # Tag shape, before -> after: `:<40-char sha>` becomes `:sha-<7>`;
    # `:main` stays; `:latest` is added on main. The chart pins this image
    # by digest, so no consumer reads either tag.
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@1366fb5a29590e522bf5a74308f55bb39a4edb56 # v0.5.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: docs-site
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/docs-site
      tag_pattern: docs-site/v(.*)
