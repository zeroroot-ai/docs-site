name: Release

on:
  push:
    branches: [main]

# The GITHUB_TOKEN gets read access only. release-please runs with
# RELEASE_PLEASE_TOKEN (a PAT), so it needs no write scope on the default
# token. publish-image is the shared image build and scopes its own
# packages:write below.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    # THE SHARED BUILD (.github#81), with the release tag as version_tag.
    # release-please cuts the release on the commit this push delivered, so
    # the checkout the shared workflow makes of github.sha is the tagged
    # commit; the `ref:` override the old job needed is gone with it.
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@017f26148bffdc5d382a265edd863e8a647e7830 # v0.4.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: docs-site
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/docs-site
      tag_pattern: docs-site/v(.*)
      version_tag: ${{ needs.release-please.outputs.tag_name }}
