name: Release

on:
  push:
    branches: [main]
  # Manual re-fire. A merge of the release PR can drop the push event that
  # triggers this workflow (seen on the 0.6.12 release commit e77db5e: it landed
  # on main with no Release run, so release-please never cut the tag and the
  # image/fan-out never ran). workflow_dispatch re-runs release-please against
  # main, which cuts the pending release and fires publish-image + fan-out.
  workflow_dispatch:

# The GITHUB_TOKEN gets read access only. release-please runs with
# RELEASE_PLEASE_TOKEN (a PAT), so it needs no write scope on the default
# token. publish-image is the shared image build and scopes its own
# packages:write below.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      image_tag: ${{ steps.image_tag.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # First-party images use the `v<semver>` tag form (gibson:v0.146.4,
      # sdk v0.184.0). release-please's tag carries a component prefix
      # (docs-site-v0.6.11), so strip it for the image tag + the version-links
      # source, leaving `v0.6.11`.
      - id: image_tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: echo "tag=${TAG_NAME#docs-site-}" >> "$GITHUB_OUTPUT"

  publish-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    # THE SHARED BUILD (.github#81), with the release tag as version_tag.
    # release-please cuts the release on the commit this push delivered, so
    # the checkout the shared workflow makes of github.sha is the tagged
    # commit; the `ref:` override the old job needed is gone with it.
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@1366fb5a29590e522bf5a74308f55bb39a4edb56 # v0.5.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: docs-site
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/docs-site
      tag_pattern: docs-site/v(.*)
      # v<semver> (component prefix stripped), matching every other first-party
      # image and the version-links source (image-tag.env).
      version_tag: ${{ needs.release-please.outputs.image_tag }}

  # Fan the new image tag into charts' docs.image pin via the org version-links
  # mechanism (.github version-links.yaml link `docs-site`). Before this, the pin
  # was hand-bumped and went months stale (staging docs 404'd on new pages).
  # Mirrors zitadel-login's caller.
  fan-out:
    needs: [release-please, publish-image]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: zeroroot-ai/.github/.github/workflows/reusable-version-fanout.yml@c06ea08fddecc754ac6faf06f9fc0511d13cb955 # v0.5.2
    permissions:
      contents: read
      packages: read
    with:
      link: docs-site
    secrets:
      app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
      app-private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}
