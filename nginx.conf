server {
    # ${NGINX_PORT} is templated at container start by the nginx-unprivileged
    # image's 20-envsubst-on-templates.sh (this file ships as
    # /etc/nginx/templates/default.conf.template). The chart runs the pod as
    # uid 101 with no NET_BIND_SERVICE, so a privileged port cannot be bound.
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the edge proxy: never build a redirect from this container's
    # own scheme/port, which the client cannot reach.
    absolute_redirect off;
    port_in_redirect off;

    # This config is deliberately plain, and must stay that way.
    #
    # It used to carry two rules that repaired the export at request time: a
    # `location = /` returning 302 /docs/, and a regex location that stripped
    # a trailing slash so `/docs/` could be served from the sibling
    # `docs.html`. Both existed because `next build` emitted a catch-all route
    # as `docs.html` beside an index-less `docs/` directory.
    #
    # That made this container the only place the export worked. The same
    # bytes on object storage — which is how docs.zeroroot.ai is served, per
    # deploy ADR-0009 — were broken, and nothing caught it because the rules
    # lived here rather than in the artifact.
    #
    # The export is now self-contained: `trailingSlash: true` emits
    # `docs/index.html`, and `public/index.html` gives the site root a real
    # file. Both are asserted by scripts/check-static-export-standalone.mjs.
    #
    # If you find yourself adding a rewrite here to make a page load, the
    # export is wrong — fix it there, or the object-storage copy stays broken.
    location / {
        # No catch-all to /index.html: an unknown path must 404, not answer
        # 200 with some other page.
        try_files $uri $uri/index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
