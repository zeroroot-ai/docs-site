server {
    # ${NGINX_PORT} is templated at container start by the nginx-unprivileged
    # image's 20-envsubst-on-templates.sh (this file ships as
    # /etc/nginx/templates/default.conf.template). The chart runs the pod as
    # uid 101 with no NET_BIND_SERVICE, so a privileged port cannot be bound.
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the edge proxy: never build a redirect from this container's
    # own scheme/port, which the client cannot reach.
    absolute_redirect off;
    port_in_redirect off;

    # The site is the docs, but fumadocs serves them under /docs (source.ts
    # baseUrl). src/app/page.tsx used to redirect / -> /docs with
    # next/navigation's redirect(), which cannot work in a static export:
    # there is no server to issue the 302, so Next emitted an error shell as
    # index.html and the root URL rendered unstyled and empty. The redirect
    # belongs here instead, where it is a real HTTP response.
    location = / {
        return 302 /docs/;
    }

    location / {
        # No catch-all to /index.html: an unknown path must 404, not answer
        # 200 with some other page.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Next's static export emits catch-all routes (e.g. /docs) as a
    # sibling "<route>.html" file, not "<route>/index.html" — the
    # "<route>/" directory also exists in the export (it holds RSC
    # payload chunks for deeper slugs) but has no index.html of its own.
    # For any request with a trailing slash, nginx's try_files treats the
    # bare $uri parameter itself as a directory check (because it already
    # ends in "/"), so it 403s on that index-less directory before ever
    # trying $uri.html. Strip the trailing slash and retry against the
    # sibling .html file first.
    location ~ ^(?<base>.+)/$ {
        try_files $base.html $uri/index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
